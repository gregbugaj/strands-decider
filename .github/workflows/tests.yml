name: tests

on:
  push:
    branches: [main, staging]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cpu:
    name: cpu (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tested floor versions and the lowest supported Python.
          - python: "3.10"
            torch: torch==2.7.1
            torchvision: torchvision==0.22.1
            pins: transformers==5.15.0 peft==0.21.0 huggingface_hub==1.5.0
          # The newest versions that pyproject.toml admits.
          - python: "3.12"
            torch: torch
            torchvision: torchvision
            pins: ""
    env:
      # The suite downloads nothing from the Hub. This setting makes a new download fail.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Install the CPU torch wheel first. The default Linux wheel on PyPI also installs several GB of CUDA libraries.
      - run: python -m pip install "${{ matrix.torch }}" "${{ matrix.torchvision }}" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,vision]" pytest-cov ${{ matrix.pins }}
      - run: python -m pytest -q --cov=src/strands_decider --cov-report=xml
      - name: Upload coverage to Codecov
        # Only from the 3.12 leg: two uploads per push double-count the same coverage.
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Uses the detached `lint` hatch env (see pyproject.toml). It skips the project install so torch
      # and other heavy runtime deps stay out of the lint job.
      - run: python -m pip install hatch
      - run: hatch run lint:check
